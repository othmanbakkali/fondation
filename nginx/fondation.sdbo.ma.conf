upstream fondation_app {
    server 127.0.0.1:8333;
}

server {
    listen 80;
    server_name fondation.sdbo.ma www.fondation.sdbo.ma;

    # Taille max des uploads (fichiers/images/vidéos)
    client_max_body_size 100M;

    # Fichiers statiques
    location /static/ {
        alias /var/www/django-fondation/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Fichiers médias (uploads utilisateurs)
    location /media/ {
        alias /var/www/django-fondation/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Application Django via Gunicorn
    location / {
        proxy_pass http://fondation_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
